services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personalcrm}
      POSTGRES_USER: ${POSTGRES_USER:-personalcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personalcrm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-personalcrm}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      CALENDAR_IMPORT_ENABLED: "1"
      ICLOUD_MODE: ${ICLOUD_MODE:-real}
      MOCK_ICLOUD_URL: ${MOCK_ICLOUD_URL:-http://mock-carddav:8080}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./openapi:/openapi:ro
      - ./db:/db:ro

  frontend:
    build:
      context: ./frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules

  mock-carddav:
    build:
      context: ./mock-carddav
    ports:
      - "8080:8080"
    volumes:
      - ./mock-carddav-data:/data/carddav
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  frontend_node_modules:
